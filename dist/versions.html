<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a2a1a">
    <title>版本介绍 - 世界生存</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a2a1a, #0d1d0d);
            color: #fff; min-height: 100vh; overflow-y: auto;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { text-align: center; font-size: 2.5em; margin-bottom: 5px; background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700, #FFEC8B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: 0 0 20px rgba(255,215,0,0.5); animation: goldShimmer 2s ease-in-out infinite; }
        @keyframes goldShimmer {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 8px rgba(255,215,0,0.3)); }
            50% { filter: brightness(1.2) drop-shadow(0 0 16px rgba(255,215,0,0.6)); }
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }

        /* 搜索栏 */
        .search-bar {
            display: flex; gap: 10px; margin-bottom: 30px;
            position: sticky; top: 0; z-index: 100;
            background: linear-gradient(135deg, #1a2a1a, #0d1d0d);
            padding: 15px 0;
        }
        .search-bar input {
            flex: 1; padding: 12px 18px; font-size: 1.1em;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; color: #fff; outline: none;
            text-align: center;
        }
        .search-bar input:focus { border-color: #6a9c5a; }
        .search-bar input::placeholder { color: #555; }
        .search-bar button {
            padding: 12px 24px; font-size: 1em; cursor: pointer;
            background: linear-gradient(135deg, #4a7c3a, #6a9c5a);
            color: #fff; border: none; border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .search-bar button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(106, 156, 90, 0.4);
        }

        /* 版本卡片 */
        .version-card {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            margin-bottom: 20px; padding: 25px 30px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .version-card:hover {
            border-color: rgba(106, 156, 90, 0.3);
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .version-card.bugfix { border-left: 3px solid #c97a3a; }
        .version-card.feature { border-left: 3px solid #6a9c5a; }
        .version-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 15px; flex-wrap: wrap;
        }
        .version-number {
            font-size: 1.6em; font-weight: bold;
            background: linear-gradient(135deg, #4a7c3a, #6a9c5a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .version-card.bugfix .version-number {
            background: linear-gradient(135deg, #c97a3a, #e89a5a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .version-tag {
            font-size: 0.75em; padding: 3px 10px; border-radius: 12px;
            background: rgba(106, 156, 90, 0.2); color: #8cba7c;
            border: 1px solid rgba(106, 156, 90, 0.3);
        }
        .version-card.bugfix .version-tag {
            background: rgba(201, 122, 58, 0.2); color: #e89a5a;
            border: 1px solid rgba(201, 122, 58, 0.3);
        }
        .version-date { font-size: 0.85em; color: #666; margin-left: auto; }
        .version-title { font-size: 1.2em; color: #ccc; margin-bottom: 12px; }
        .version-content { list-style: none; }
        .version-content li {
            padding: 6px 0 6px 24px; position: relative;
            color: #aaa; font-size: 0.95em; line-height: 1.6;
        }
        .version-content li::before {
            content: '▸'; position: absolute; left: 5px; color: #6a9c5a;
        }
        .version-card.bugfix .version-content li::before { color: #c97a3a; }

        /* 无结果 */
        .no-result {
            text-align: center; color: #555; font-size: 1.2em;
            padding: 60px 20px; display: none;
        }

        /* 返回按钮 */
        .btn-back {
            display: block; margin: 0 auto 30px;
            padding: 10px 30px; font-size: 1em; cursor: pointer;
            background: rgba(0,0,0,0.4); color: #ccc;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            text-decoration: none; text-align: center;
            transition: all 0.2s; width: fit-content;
        }
        .btn-back:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

        .version-list-label {
            font-size: 0.8em; color: #555; margin-bottom: 15px;
        }
        .version-nav {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px;
        }
        .version-nav-item {
            padding: 4px 12px; font-size: 0.85em; cursor: pointer;
            background: rgba(0,0,0,0.3); color: #888;
            border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
            transition: all 0.2s;
        }
        .version-nav-item:hover {
            color: #6a9c5a; border-color: rgba(106, 156, 90, 0.3);
        }
        .version-nav-item.bugfix { color: #c97a3a; }
        .version-nav-item.bugfix:hover { border-color: rgba(201, 122, 58, 0.3); }
    </style>
</head>

        // 渲染版本列表（按时间顺序）
        function renderVersions(filter) {
            const list = document.getElementById('versionList');
            const noResult = document.getElementById('noResult');
            list.innerHTML = '';
            let shown = 0;

            for (const v of VERSIONS) {
                if (filter && !v.version.toLowerCase().includes(filter.toLowerCase())) continue;
                const card = document.createElement('div');
                card.className = 'version-card ' + v.type;
                const tagText = v.type === 'bugfix' ? '修bug' : '更新';
                const itemsHtml = v.items.map(item => `<li>${item}</li>`).join('');
                card.innerHTML = `
                    <div class="version-header">
                        <span class="version-number">${v.version}</span>
                        <span class="version-tag">${tagText}</span>
                        <span class="version-date">${v.date}</span>
                    </div>
                    <div class="version-title">${v.title}</div>
                    <ul class="version-content">${itemsHtml}</ul>
                `;
                list.appendChild(card);
                shown++;
            }

            noResult.style.display = shown === 0 ? 'block' : 'none';
        }

        // 渲染版本导航
        function renderNav() {
            const nav = document.getElementById('versionNav');
            nav.innerHTML = '';
            for (const v of VERSIONS) {
                const item = document.createElement('div');
                item.className = 'version-nav-item' + (v.type === 'bugfix' ? ' bugfix' : '');
                item.textContent = v.version;
                item.addEventListener('click', () => {
                    document.getElementById('versionSearch').value = v.version;
                    renderVersions(v.version);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                nav.appendChild(item);
            }
        }

        // 搜索
        function doSearch() {
            const val = document.getElementById('versionSearch').value.trim();
            renderVersions(val);
        }

        document.getElementById('searchBtn').addEventListener('click', doSearch);
        document.getElementById('showAllBtn').addEventListener('click', () => {
            document.getElementById('versionSearch').value = '';
            renderVersions('');
        });
        document.getElementById('versionSearch').addEventListener('keydown', (e) => {
            if (e.code === 'Enter') doSearch();
        });

        // 初始化
        renderNav();
        renderVersions('');
