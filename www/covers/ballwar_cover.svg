    <path d="M345 458a72 72 0 0 1 60 34" stroke="#fff" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
  </g>

  <!-- 对手蓝球(右上,持枪) -->
  <g>
    <ellipse cx="955" cy="300" rx="64" ry="16" fill="#000" opacity="0.4"/>
    <path d="M1010 260 Q1080 235 1120 215" stroke="#4fc3f7" stroke-width="7" stroke-linecap="round" opacity="0.45" fill="none"/>
    <circle cx="955" cy="275" r="58" fill="url(#ballBlue)" stroke="#bbdefb" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="934" cy="253" rx="18" ry="10" fill="#fff" opacity="0.55" transform="rotate(-25 934 253)"/>
    <circle cx="942" cy="272" r="7" fill="#1a1a1a"/><circle cx="972" cy="272" r="7" fill="#1a1a1a"/>
    <circle cx="944" cy="270" r="2.5" fill="#fff"/><circle cx="974" cy="270" r="2.5" fill="#fff"/>
    <path d="M944 292q13 -8 26 0" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
