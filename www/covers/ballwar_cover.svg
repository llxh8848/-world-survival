  <!-- 血量球(左下主角,冲刺) -->
  <g>
    <ellipse cx="345" cy="560" rx="70" ry="18" fill="#000" opacity="0.4"/>
    <path d="M275 520 Q200 540 160 570 M285 545 Q230 575 200 600" stroke="#66bb6a" stroke-width="7" stroke-linecap="round" opacity="0.45" fill="none"/>
    <circle cx="345" cy="530" r="62" fill="url(#ballGreen)" stroke="#c8e6c9" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="322" cy="507" rx="20" ry="11" fill="#fff" opacity="0.55" transform="rotate(-25 322 507)"/>
    <path d="M345 512c-2-4 -8-6 -11-2a6 6 0 0 0 0 8l11 10 11-10a6 6 0 0 0 0-8c-3-4 -9-2 -11 2z" fill="#e53935" opacity="0.9"/>
    <circle cx="330" cy="530" r="7" fill="#1a1a1a"/><circle cx="362" cy="530" r="7" fill="#1a1a1a"/>
    <circle cx="332" cy="528" r="2.5" fill="#fff"/><circle cx="364" cy="528" r="2.5" fill="#fff"/>
    <path d="M330 550q16 10 32 0" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
