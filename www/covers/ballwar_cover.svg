<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#14264a"/>
      <stop offset="55%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#03060f"/>
    </radialGradient>
    <radialGradient id="ballRed" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffab91"/><stop offset="45%" stop-color="#ff5722"/><stop offset="100%" stop-color="#8f2100"/>
    </radialGradient>
    <radialGradient id="ballBlue" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#b3e5fc"/><stop offset="45%" stop-color="#4fc3f7"/><stop offset="100%" stop-color="#01579b"/>
    </radialGradient>
    <radialGradient id="ballGold" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe082"/><stop offset="45%" stop-color="#f9a825"/><stop offset="100%" stop-color="#8d5a00"/>
    </radialGradient>
    <radialGradient id="ballPurple" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#616161"/><stop offset="45%" stop-color="#212121"/><stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="ballGreen" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a5d6a7"/><stop offset="45%" stop-color="#66bb6a"/><stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <radialGradient id="ballDark" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#757575"/><stop offset="45%" stop-color="#212121"/><stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/><stop offset="40%" stop-color="#ffd54f"/><stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="laserR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5252"/><stop offset="50%" stop-color="#ff1744"/><stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>
    <linearGradient id="hp1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#69f0ae"/><stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="hp2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffab40"/><stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowBig"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- 星星 -->
  <g fill="#cfe4ff">
    <circle cx="80" cy="90" r="1.6"/><circle cx="190" cy="60" r="1.1"/><circle cx="320" cy="120" r="1.8"/><circle cx="470" cy="70" r="1.2"/>
    <circle cx="620" cy="45" r="1.5"/><circle cx="760" cy="90" r="1.1"/><circle cx="900" cy="55" r="1.9"/><circle cx="1050" cy="110" r="1.3"/>
    <circle cx="1180" cy="70" r="1.6"/><circle cx="1230" cy="200" r="1.2"/><circle cx="60" cy="240" r="1.4"/><circle cx="1130" cy="300" r="1.1"/>
    <circle cx="150" cy="620" r="1.5"/><circle cx="300" cy="670" r="1.1"/><circle cx="500" cy="640" r="1.7"/><circle cx="820" cy="660" r="1.3"/>
    <circle cx="1100" cy="640" r="1.6"/><circle cx="1230" cy="560" r="1.2"/><circle cx="960" cy="620" r="1.1"/><circle cx="700" cy="680" r="1.4"/>
    <circle cx="430" cy="690" r="1.2"/><circle cx="60" cy="400" r="1.8"/><circle cx="1240" cy="430" r="1.5"/>
  </g>
  <!-- 亮星十字光 -->
  <g stroke="#e8f2ff" stroke-width="1.2" opacity="0.9">
    <path d="M320 112v16M312 120h16"/><path d="M900 47v16M892 55h16"/><path d="M500 632v16M492 640h16"/>
  </g>

  <!-- 科技网格 -->
  <g stroke="#3e8fd9" stroke-width="1" opacity="0.10">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280"/>
    <path d="M160 0v720M320 0v720M480 0v720M640 0v720M800 0v720M960 0v720M1120 0v720"/>
  </g>
  <!-- 全息环 -->
  <g fill="none" stroke="#4fc3f7" opacity="0.25" stroke-dasharray="14 18">
    <circle cx="640" cy="380" r="300" stroke-width="2"/>
    <circle cx="640" cy="380" r="390" stroke-width="1.5"/>
  </g>
  <circle cx="640" cy="380" r="345" fill="none" stroke="#64b5f6" stroke-width="1" opacity="0.15"/>

  <!-- 上飘星尘粒子 -->
  <g fill="#9ecbff">
    <circle cx="240" cy="330" r="2" opacity="0.35"/><circle cx="360" cy="280" r="1.5" opacity="0.25"/><circle cx="520" cy="560" r="2.2" opacity="0.3"/>
    <circle cx="760" cy="540" r="1.7" opacity="0.35"/><circle cx="1020" cy="420" r="2" opacity="0.3"/><circle cx="940" cy="220" r="1.4" opacity="0.25"/>
    <circle cx="180" cy="470" r="2.4" opacity="0.3"/><circle cx="1150" cy="520" r="1.8" opacity="0.3"/>
  </g>

  <!-- 场地边界：红激光矩形 -->
  <g filter="url(#glow)">
    <rect x="120" y="150" width="1040" height="480" fill="none" stroke="url(#laserR)" stroke-width="5" rx="6"/>
  </g>
  <rect x="120" y="150" width="1040" height="480" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" rx="6"/>
  <!-- 四角能量锚点 -->
  <g stroke="#ffffff" stroke-width="5" fill="none" filter="url(#glow)">
    <path d="M120 178V150h28"/><path d="M1160 150h-28M1160 150v28"/><path d="M120 602v28h28"/><path d="M1160 630v-28h-28"/>
  </g>

  <!-- 冲击波：红蓝相撞中心 -->
  <g>
    <circle cx="640" cy="390" r="130" fill="#ffffff" opacity="0.06"/>
    <circle cx="640" cy="390" r="95" fill="none" stroke="#fff59d" stroke-width="3" opacity="0.5" filter="url(#soft)"/>
    <circle cx="640" cy="390" r="60" fill="#fff" opacity="0.35" filter="url(#soft)"/>
    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M640 285v-38"/><path d="M640 495v38"/><path d="M535 390h-42"/><path d="M745 390h42"/>
      <path d="M566 316l-26-26"/><path d="M714 464l26 26"/><path d="M714 316l26-26"/><path d="M566 464l-26 26"/>
    </g>
    <g stroke="#ffd54f" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M605 300l-12-30"/><path d="M675 300l12-30"/><path d="M605 480l-12 30"/><path d="M675 480l12 30"/>
    </g>
