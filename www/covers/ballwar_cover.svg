    <path d="M900 310 L780 400" stroke="#8d6e63" stroke-width="9" stroke-linecap="round"/>
    <path d="M895 305 L775 395" stroke="#a1887f" stroke-width="4" stroke-linecap="round"/>
    <path d="M775 395 L745 430 L762 400 L742 402 Z" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  </g>

