  <g>
    <path d="M965 200a16 16 0 0 1-4-2l-6 18 16-11a16 16 0 0 1-6-5z" fill="#fff" stroke="#263238" stroke-width="2"/>
    <rect x="848" y="150" width="210" height="46" rx="23" fill="#fff" stroke="#263238" stroke-width="2.5"/>
    <text x="953" y="180" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="23" font-weight="bold" fill="#263238" text-anchor="middle">我打这个?</text>
  </g>

  <!-- 爆炸特效(左边界) -->
  <g transform="translate(165,180)" filter="url(#glow)">
    <path d="M0 -42 L10 -14 L38 -24 L18 0 L42 10 L14 12 L22 38 L0 20 L-20 40 L-14 12 L-42 14 L-16 -2 L-36 -22 L-10 -12 Z" fill="#ffab00"/>
    <path d="M0 -26 L7 -8 L24 -14 L11 1 L26 8 L9 9 L14 24 L0 13 L-12 25 L-9 8 L-26 9 L-10 -1 L-22 -14 L-6 -7 Z" fill="#fff176"/>
    <circle r="9" fill="#fff"/>
  </g>
  <!-- 小爆炸(右下) -->
  <g transform="translate(720,600)">
    <path d="M0 -24 L6 -8 L22 -14 L11 0 L24 6 L8 7 L13 22 L0 11 L-11 23 L-8 7 L-24 8 L-9 -1 L-21 -13 L-6 -7 Z" fill="#ff7043" opacity="0.9"/>
    <circle r="5" fill="#ffe082"/>
  </g>
  <!-- 碎屑粒子 -->
  <g fill="#ffcc80" opacity="0.85">
    <circle cx="195" cy="150" r="3"/><circle cx="140" cy="205" r="2.5"/><circle cx="225" cy="195" r="2"/><circle cx="695" cy="575" r="2.5"/><circle cx="745" cy="625" r="2"/>
  </g>

  <!-- 伤害飘字 -->
  <g font-family="Arial, sans-serif" font-weight="bold" filter="url(#glow)">
    <text x="430" y="470" font-size="34" fill="#ff5722" transform="rotate(-8 430 470)">-35</text>
    <text x="830" y="240" font-size="30" fill="#ffd54f" transform="rotate(7 830 240)">暴击!</text>
    <text x="480" y="300" font-size="26" fill="#80d8ff">-12</text>
    <text x="700" y="180" font-size="24" fill="#b9f6ca">+20</text>
    <text x="990" y="560" font-size="26" fill="#69f0ae" transform="rotate(5 990 560)">MISS!</text>
  </g>

  <!-- 顶部血条 -->
  <g>
    <rect x="150" y="62" width="360" height="26" rx="13" fill="#000" opacity="0.55" stroke="#546e7a" stroke-width="2"/>
    <rect x="154" y="66" width="270" height="18" rx="9" fill="url(#hp1)"/>
    <text x="165" y="82" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">血量 · LV12</text>
    <text x="770" y="82" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="end">速度 · LV11</text>
    <rect x="770" y="62" width="360" height="26" rx="13" fill="#000" opacity="0.55" stroke="#546e7a" stroke-width="2"/>
    <rect x="774" y="66" width="200" height="18" rx="9" fill="url(#hp2)"/>
    <!-- VS 徽标 -->
    <g filter="url(#glow)">
      <circle cx="640" cy="75" r="34" fill="#1a237e" stroke="#ffd54f" stroke-width="3.5"/>
      <text x="640" y="88" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" font-style="italic">VS</text>
    </g>
  </g>

  <!-- 标题 -->
  <g filter="url(#glowBig)">
    <text x="640" y="140" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="86" font-weight="900" text-anchor="middle" fill="url(#titleGrad)" stroke="#7a4400" stroke-width="2" paint-order="stroke" letter-spacing="8">小球战争</text>
  </g>
  <text x="640" y="178" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="26" text-anchor="middle" fill="#90caf9" letter-spacing="14">BALL BATTLE ARENA</text>

  <!-- 技能图标条(底部) -->
  <g>
    <rect x="470" y="645" width="340" height="52" rx="12" fill="#000" opacity="0.5" stroke="#37474f" stroke-width="1.5"/>
    <g transform="translate(486,657)"><rect width="30" height="30" rx="7" fill="#37474f"/><path d="M8 22L20 10M20 10l2-4 2 2-4 2z" stroke="#eceff1" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(530,657)"><rect width="30" height="30" rx="7" fill="#37474f"/><path d="M17 4 9 16h5l-2 10 9-13h-5z" fill="#ffd54f"/></g>
    <g transform="translate(574,657)"><rect width="30" height="30" rx="7" fill="#37474f"/><circle cx="15" cy="17" r="8" fill="#90a4ae"/><path d="M15 9c0-3 2-4 4-4" stroke="#ffab00" stroke-width="2" fill="none"/></g>
    <g transform="translate(618,657)"><rect width="30" height="30" rx="7" fill="#37474f"/><path d="M15 4v20M6 8l18 12M24 8 6 20" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round"/></g>
    <g transform="translate(662,657)"><rect width="30" height="30" rx="7" fill="#37474f"/><path d="M15 6a8 8 0 1 1-8 8" fill="none" stroke="#ea80fc" stroke-width="3" stroke-linecap="round"/><circle cx="15" cy="14" r="3" fill="#ea80fc"/></g>
    <g transform="translate(706,657)"><rect width="30" height="30" rx="7" fill="#37474f"/><path d="M5 20L15 8l4 5 6-8" stroke="#69f0ae" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(750,657)"><rect width="30" height="30" rx="7" fill="#37474f"/><path d="M8 8h14l-3 14h-8z" fill="#ef5350"/><circle cx="15" cy="12" r="2" fill="#fff"/></g>
  </g>

  <!-- 角标 -->
  <g>
    <rect x="1130" y="30" width="120" height="34" rx="17" fill="#d32f2f" filter="url(#glow)"/>
    <text x="1190" y="53" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">● 激战中</text>
    <rect x="30" y="30" width="150" height="34" rx="17" fill="#1a237e" stroke="#448aff" stroke-width="2"/>
    <text x="105" y="53" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#bbdefb" text-anchor="middle">最新赛季 S0</text>
  </g>
</svg>
