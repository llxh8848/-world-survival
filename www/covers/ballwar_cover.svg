  <g>
    <path d="M220 386a18 18 0 0 1-4 0l-10 22 24-14a18 18 0 0 1-10-8z" fill="#fff" stroke="#263238" stroke-width="2"/>
    <rect x="218" y="382" width="230" height="48" rx="24" fill="#fff" stroke="#263238" stroke-width="2.5"/>
    <text x="333" y="414" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="24" font-weight="bold" fill="#263238" text-anchor="middle">终于到我了!</text>
  </g>
